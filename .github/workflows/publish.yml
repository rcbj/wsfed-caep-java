name: publish

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    # The test workflow has already succeeded for this commit on main.
    # Publish only when that commit is a pull request merged into main.
    # A direct push stays unpublished. The checkout is the commit the tests
    # ran. A version already on Maven Central is left there: a release there
    # is permanent, and the next one is a new version.
    #
    # Only library/ is deployed (com.iyasec:wsfed-caep); the demo never is.
    # Maven Central has no trusted publishing, so this job uses four
    # repository secrets: the Central Portal user token and the release
    # signing key.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Require a pull request merged into main
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          count=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/commits/${SHA}/pulls" \
            --jq '[.[] | select(.base.ref == "main" and .merged_at != null)] | length')
          if [ "$count" = "0" ]; then
            echo "This commit on main did not come from a merged pull request."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.publish == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Skip a version already on Maven Central
        id: version
        if: steps.gate.outputs.publish == 'true'
        run: |
          set -eu
          python3 - <<'PY'
          import os, urllib.error, urllib.request
          import xml.etree.ElementTree as ET
          ns = {"m": "http://maven.apache.org/POM/4.0.0"}
          root = ET.parse("library/pom.xml").getroot()
          group = root.find("m:groupId", ns).text
          artifact = root.find("m:artifactId", ns).text
          version = root.find("m:version", ns).text
          url = "https://repo1.maven.org/maven2/%s/%s/%s/%s-%s.pom" % (
              group.replace(".", "/"), artifact, version, artifact, version)
          try:
              urllib.request.urlopen(url)
              exists = True
          except urllib.error.HTTPError as e:
              if e.code != 404:
                  raise SystemExit("Maven Central returned %d for %s" % (e.code, url))
              exists = False
          if exists:
              print("%s:%s:%s is already on Maven Central." % (group, artifact, version))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("deploy=%s\n" % ("false" if exists else "true"))
          PY

      - name: Deploy the library
        if: steps.version.outputs.deploy == 'true'
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/m2"
          # The token stays in the environment; settings.xml only names it.
          cat > "$RUNNER_TEMP/m2/settings.xml" <<'XML'
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${env.CENTRAL_TOKEN_USERNAME}</username>
                <password>${env.CENTRAL_TOKEN_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          XML
          docker run --rm \
            -v "$PWD":/src \
            -v "$RUNNER_TEMP/m2/settings.xml":/root/.m2/settings.xml:ro \
            -w /src \
            -e CENTRAL_TOKEN_USERNAME \
            -e CENTRAL_TOKEN_PASSWORD \
            -e MAVEN_GPG_KEY \
            -e MAVEN_GPG_PASSPHRASE \
            maven:3.9.9-eclipse-temurin-17 \
            mvn -B -ntp -Prelease -f library/pom.xml deploy
